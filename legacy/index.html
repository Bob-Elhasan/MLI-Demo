<style>
/* Single deliberate light look (a brand demo), every color set explicitly */
:root{
  color-scheme:light;
  --teal:#006660;--teal-d:#004d48;--teal-l:#e3efed;--green:#0FB373;--ink:#34293A;--ink-2:#1f1a22;
  --mut:#5b5f66;--line:#dfe2e5;--line-2:#c9cdd2;--tint:#F2F7F6;--paper:#ffffff;--sand:#faf8f5;
  --wa:#167a40;--warn:#9a5b00;--warn-bg:#fdf3e2;--bad:#b3261e;--bad-bg:#fbeceb;--ok-bg:#e6f4ee;
  --pop:#1f1a22;--pop-mut:#c9c3cf;--pin:#c2410c;
  --r-sm:10px;--r:16px;--r-lg:24px;
  --f:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --wrap:1216px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:60}
h1,h2,h3,h4,p,ul,ol,figure{margin:0;padding:0}
ul,ol{list-style:none}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
img{max-width:100%;display:block}
h1{font-size:clamp(30px,4.4vw,48px);line-height:1.25;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:clamp(23px,2.6vw,32px);line-height:1.35;font-weight:700;text-wrap:balance}
h3{font-size:19px;line-height:1.45;font-weight:600}
h4{font-size:16px;line-height:1.5;font-weight:600}
[lang=en] h1{letter-spacing:-.02em;line-height:1.15}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:768px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
.sec{padding-block:clamp(48px,7vw,88px)}
.sec.t{background:var(--tint)}
.sec.s{background:var(--sand)}
.sec.tight{padding-block:clamp(32px,4vw,48px)}
.mut{color:var(--mut)}
.small{font-size:14px;line-height:1.6}
.xs{font-size:13px;line-height:1.55}
.num{font-feature-settings:"tnum";unicode-bidi:isolate;direction:ltr;display:inline-block}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
.eyebrow{font-size:14px;font-weight:600;color:var(--teal);display:inline-flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--green);border-radius:2px}
.row{display:flex;gap:16px;align-items:center}
.row>*{min-width:0}
.col{display:flex;flex-direction:column;gap:16px}
.wrapr{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.g2,.g3,.g4{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1023px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:767px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.g4.keep2{grid-template-columns:repeat(2,minmax(0,1fr))}.g4:not(.keep2){grid-template-columns:minmax(0,1fr)}}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.head p{max-width:60ch}
.lnk{font-weight:600;color:var(--teal);display:inline-flex;gap:6px;align-items:center}
.lnk:hover{text-decoration:underline;text-underline-offset:4px}
.arrow::after{content:"←";font-family:var(--f)}
[dir=ltr] .arrow::after{content:"→"}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;background:var(--teal);color:#fff;border:1.5px solid var(--teal);font-weight:600;font-size:16px;white-space:nowrap;transition:background .15s,transform .1s}
.btn:hover{background:var(--teal-d);border-color:var(--teal-d)}
.btn:active{transform:scale(.98)}
.btn.o{background:#fff;color:var(--teal)}
.btn.o:hover{background:var(--teal-l)}
.btn.wa{background:#fff;color:var(--wa);border-color:var(--wa)}
.btn.wa:hover{background:#eaf5ee}
.btn.sm{min-height:40px;padding:0 18px;font-size:15px}
.btn.full{width:100%}
.btn[disabled]{background:#e6e8eb;border-color:#e6e8eb;color:#7a7f87;cursor:not-allowed}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:6px}

.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1px solid var(--line-2);border-radius:999px;font-size:13px;font-weight:500;background:#fff;white-space:nowrap}
.chip.k{border-color:var(--teal);color:var(--teal)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.src{align-self:flex-start;font-size:12px;color:var(--mut);background:#fff;white-space:normal;min-height:28px;padding-block:2px;line-height:1.4;max-width:100%}
.chip.src::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
button.chip{cursor:pointer}
.card{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:24px;min-width:0}
.card.flat{border:0;background:var(--tint)}
.card.hov{transition:border-color .15s,box-shadow .2s,transform .2s}
.card.hov:hover{border-color:var(--teal);box-shadow:0 10px 30px -18px rgba(0,77,72,.45);transform:translateY(-2px)}
.ic{width:44px;height:44px;border-radius:12px;background:var(--teal-l);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:22px;height:22px}
.kt{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.kt span:first-child{color:var(--mut)}
.ph{position:relative;border-radius:var(--r);overflow:hidden;background:linear-gradient(135deg,#0b6b65 0%,#0f8d72 55%,#5fc9a0 100%);color:#fff;display:flex;align-items:flex-end;min-height:160px}
.ph::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 70% at 80% 20%,rgba(255,255,255,.22),transparent 60%),repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 2px,transparent 2px 14px)}
.ph span{position:relative;font-size:12px;padding:10px 14px;background:rgba(0,40,37,.42);border-start-end-radius:12px;max-width:100%}
.ph.sand{background:linear-gradient(135deg,#e9dfcf,#d7c6ab 60%,#b99f7a)}
.ph.ink{background:linear-gradient(135deg,#34293A,#5a4a63)}
.fld{display:block;width:100%;min-height:50px;border:1px solid var(--line-2);border-radius:12px;padding:0 14px;background:#fff;font-size:16px}
.fld:focus{border-color:var(--teal);outline:2px solid var(--teal-l)}
select.fld{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:left 18px center,left 13px center;background-size:5px 5px;background-repeat:no-repeat}
[dir=ltr] select.fld{background-position:right 13px center,right 18px center}
label.lb{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.6;color:var(--mut)}
.consent input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--teal);flex:none}
.legal{font-size:12.5px;color:var(--mut);line-height:1.6}
.ph-tag{word-break:break-word;font-family:'IBM Plex Mono','IBM Plex Sans Arabic',monospace;font-size:11.5px;color:var(--warn);background:var(--warn-bg);padding:1px 6px;border-radius:4px;unicode-bidi:plaintext}
details.faq{border-bottom:1px solid var(--line)}
details.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px 0;font-weight:600;font-size:17px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";font-size:24px;color:var(--teal);font-weight:400;line-height:1}
details.faq[open] summary::after{content:"−"}
details.faq p{padding-bottom:18px;color:var(--mut)}
table.tb{width:100%;border-collapse:collapse;font-size:15px}
table.tb th{text-align:start;font-weight:600;font-size:13px;color:var(--mut);padding:10px 12px;border-bottom:2px solid var(--ink)}
table.tb td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbx{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.tbx table.tb th:first-child,.tbx table.tb td:first-child{padding-inline-start:20px}
.notice{border:1px solid var(--line-2);border-inline-start:4px solid var(--teal);border-radius:12px;padding:16px 18px;background:#fff;font-size:14px;line-height:1.7}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--teal-l);color:var(--teal-d)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.stat{font-size:clamp(30px,3.4vw,42px);font-weight:700;line-height:1.1;color:var(--teal-d)}
.steps{counter-reset:s;display:grid;gap:16px}

/* ===== Apple layer: materials, type, spacing, motion. Brand accents kept: teal #006660, green #0FB373, ink #34293A ===== */
:root{
  --f:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Arabic','IBM Plex Sans Arabic','Segoe UI',system-ui,sans-serif;
  --gray:#f5f5f7;--gray-2:#e8e8ed;--label-2:#6e6e73;--sep:rgba(52,41,58,.12);
  --mut:#5f6066;--line:rgba(52,41,58,.10);--line-2:rgba(52,41,58,.18);
  --r:20px;--r-lg:28px;--r-sm:12px;
  --sh-1:0 1px 2px rgba(31,26,34,.04),0 6px 20px -10px rgba(31,26,34,.14);
  --sh-2:0 2px 6px rgba(31,26,34,.05),0 24px 48px -20px rgba(31,26,34,.22);
  --ease:cubic-bezier(.22,.9,.24,1);
}
html{scroll-behavior:auto}
body{font-family:var(--f);font-size:17px;line-height:1.6;letter-spacing:0;color:var(--ink);text-rendering:optimizeLegibility}
[lang=en] body{line-height:1.47;letter-spacing:-.011em}
/* size-specific tracking (Latin only; Arabic joins must never be tracked) */
h1{font-size:clamp(36px,5.4vw,64px);line-height:1.22;font-weight:700}
h2{font-size:clamp(28px,3.6vw,44px);line-height:1.25;font-weight:700}
h3{font-size:clamp(19px,1.6vw,22px);line-height:1.35;font-weight:600}
[lang=en] h1{letter-spacing:-.028em;line-height:1.06}
[lang=en] h2{letter-spacing:-.022em;line-height:1.1}
[lang=en] h3{letter-spacing:-.012em}
[lang=en] .small,[lang=en] .xs{letter-spacing:-.003em}
.lead{font-size:clamp(18px,1.6vw,21px);line-height:1.55;color:var(--label-2)}
[lang=en] .lead{letter-spacing:-.016em;line-height:1.42}
.mut{color:var(--label-2)}
.sec{padding-block:clamp(64px,9vw,128px)}
.sec.tight{padding-block:clamp(40px,5vw,64px)}
.sec.t{background:var(--tint)}
.sec.s{background:var(--gray)}
.head{margin-bottom:clamp(24px,3vw,40px)}
.eyebrow{font-size:15px;font-weight:600;color:var(--teal)}
.eyebrow::before{width:14px;height:3px;background:var(--green)}

/* controls: respond on press, instantly */
.btn{min-height:46px;padding:0 22px;font-size:16px;font-weight:600;border:0;background:var(--teal);box-shadow:0 1px 1px rgba(0,77,72,.2);transition:transform .12s var(--ease),background .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--teal-d)}
.btn:active{transform:scale(.97);transition-duration:60ms}
.btn.o{background:var(--teal-l);color:var(--teal-d);box-shadow:none}
.btn.o:hover{background:#d3e6e3}
.btn.wa{background:#e7f3ec;color:#125f33;box-shadow:none}
.btn.wa:hover{background:#d6ecdf}
.btn.sm{min-height:38px;padding:0 16px;font-size:15px}
.btn[disabled]{background:var(--gray-2);color:#8a8a8f;box-shadow:none}
.lnk{font-weight:500}
.chip{border:0;background:var(--gray);min-height:34px;padding:0 14px;font-size:14px;transition:transform .12s var(--ease),background .2s}
button.chip:active,a.chip:active{transform:scale(.96)}
.chip.k{background:var(--teal-l);color:var(--teal-d)}
.chip.on{background:var(--ink);color:#fff}
.chip.src{background:transparent;padding-inline:0;color:var(--label-2)}
.sec.t .chip:not(.on):not(.k):not(.src){background:#fff}
.badge{font-weight:600}

/* surfaces */
.card{border:0;border-radius:var(--r);background:#fff;box-shadow:var(--sh-1);padding:clamp(20px,2.2vw,28px)}
.sec:not(.t):not(.s) .card:not(.flat){box-shadow:none;background:var(--gray)}
.sec:not(.t):not(.s) .card.flat{background:var(--gray)}
.card.flat{background:#fff;box-shadow:none}
.card.hov{transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.card.hov:hover{transform:translateY(-3px) scale(1.005);box-shadow:var(--sh-2);border:0}
.card.hov:active{transform:scale(.985);transition-duration:80ms}
.ic{border-radius:12px;background:var(--teal-l)}
.kt{border-top:1px solid var(--sep);padding:12px 0}
.tbx{border:0;box-shadow:var(--sh-1);border-radius:var(--r)}
.sec:not(.t):not(.s) .tbx{box-shadow:none;background:var(--gray)}
table.tb th{border-bottom:1px solid var(--sep);text-transform:none;font-size:13px}
table.tb td{border-bottom:1px solid var(--sep)}
.notice{border:0;border-inline-start:3px solid var(--teal);background:#fff;box-shadow:var(--sh-1);border-radius:14px}
.sec:not(.t):not(.s) .notice{background:var(--gray);box-shadow:none}
.ph{border-radius:var(--r);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.ph span{backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);background:rgba(0,30,28,.35);font-weight:500}
.fld{border:0;background:var(--gray);border-radius:12px;min-height:50px;transition:box-shadow .2s,background .2s}
.sec.t .fld,.card .fld{background:#fff;box-shadow:inset 0 0 0 1px var(--line-2)}
.sec:not(.t):not(.s) .card .fld{background:#fff}
.fld:focus{outline:0;box-shadow:0 0 0 4px rgba(0,102,96,.22),inset 0 0 0 1px var(--teal)}
details.faq{border-bottom:1px solid var(--sep)}

function drawer(){
  const d = (t, items, open) => `<details${open?' open':''}><summary>${t}</summary>${items.map(([h,x])=>`<a href="#${h}">${x}</a>`).join('')}</details>`;
  return `<div class="drawer" id="drawer" aria-hidden="true"><div class="scrim" data-drawer="close"></div>
<div class="panel" role="dialog" aria-modal="true" aria-label="${L('القائمة','Menu')}"${W('g-drawer')}>

    <input class="fld" type="search" placeholder="${L('بتدوّر على إيه؟','What are you looking for?')}" aria-label="${L('بحث','Search')}"${W('m-search')}>

    <div${W('m-acc')}>
    ${d(L('المنتجات','Products'), [['product',L('ادخار ومعاش','Savings & pension')],['product',L('حماية الأسرة','Family protection')],['product',L('تعليم ولادك','Your kids’ education')],['trust',L('تأمين تكافلي','Takaful')],['quote',L('مش عارف أختار؟ ساعدني','Not sure? Help me choose')]], true)}

  return `<footer class="ft"><div class="wrap">
  <div class="lic"${W('g-lic')}><span class="logo-w"><img src="${LOGO}" alt="${L('مصر لتأمينات الحياة','Misr Life Insurance')}"></span>

/* ---------- motion: springs, interruptible sheets, momentum, reveals ---------- */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');
// Critically damped by default (damping 1). response = seconds, Apple-style parameters.
function spring(state, to, {response = 0.35, damping = 1, velocity} = {}, onFrame, onDone){
  if (state.raf) cancelAnimationFrame(state.raf);           // interrupt: keep current value and velocity
  if (velocity !== undefined) state.v = velocity;
  if (REDUCED.matches){ state.x = to; state.v = 0; onFrame(to); onDone && onDone(); return; }
  const k = Math.pow(2 * Math.PI / response, 2), c = 4 * Math.PI * damping / response;
  let last = performance.now();
  const step = now => {
    let dt = Math.min(0.032, (now - last) / 1000); last = now;
    for (let i = 0; i < 4; i++){ const h = dt / 4; const a = -k * (state.x - to) - c * state.v; state.v += a * h; state.x += state.v * h; }
    onFrame(state.x);
    if (Math.abs(state.x - to) < 0.0005 && Math.abs(state.v) < 0.01){ state.x = to; state.v = 0; onFrame(to); state.raf = 0; onDone && onDone(); return; }
    state.raf = requestAnimationFrame(step);
  };
  state.raf = requestAnimationFrame(step);
}
// Apple's momentum projection (exponential decay), in the same units as the velocity
const project = (v, d = 0.998) => (v / 1000) * d / (1 - d);
const rubber = (o, dim, c = 0.55) => (o * dim * c) / (dim + c * Math.abs(o));

/* A grabbable panel. progress 0 = closed, 1 = open. axis 'x' (drawer) or 'y' (bottom sheet). */
function makeSheet(root, panel, scrim, axis){
  const s = { x: 0, v: 0, raf: 0 };
  const size = () => axis === 'x' ? panel.offsetWidth : panel.offsetHeight;
  const sign = () => axis === 'y' ? 1 : (document.documentElement.dir === 'rtl' ? -1 : 1); // direction the panel travels to close
  const paint = p => {
    const off = (1 - p) * size() * sign();
    panel.style.transform = axis === 'x' ? `translate3d(${off}px,0,0)` : `translate3d(0,${off}px,0)`;
    scrim.style.opacity = Math.max(0, Math.min(1, p));
    if (REDUCED.matches) panel.style.opacity = p > 0.01 ? 1 : 0;
  };
  const to = (target, opts = {}) => {
    root.classList.add('moving');
    if (target === 1){ root.classList.add('open'); root.setAttribute('aria-hidden','false'); }
    spring(s, target, { response: 0.32, damping: target === 1 ? 1 : 0.95, ...opts }, paint, () => {
      root.classList.remove('moving');
      if (target === 0){ root.classList.remove('open'); root.setAttribute('aria-hidden','true'); }
    });
  };
  paint(0);
  // 1:1 drag with grab offset, rubber band past open, velocity handoff on release
  let start = null, hist = [];
  panel.addEventListener('pointerdown', e => {
    if (e.target.closest('input,select,textarea,button,a,summary,label')) return;
    start = { p: axis === 'x' ? e.clientX : e.clientY, x0: s.x, id: e.pointerId, moved: false };
    hist = [{ t: e.timeStamp, p: start.p }];
    if (s.raf){ cancelAnimationFrame(s.raf); s.raf = 0; } // grab mid-flight
  });
  panel.addEventListener('pointermove', e => {
    if (!start) return;
    const p = axis === 'x' ? e.clientX : e.clientY, d = p - start.p;
    if (!start.moved){ if (Math.abs(d) < 10) return; start.moved = true; panel.setPointerCapture(start.id); root.classList.add('moving'); }
    hist.push({ t: e.timeStamp, p }); if (hist.length > 6) hist.shift();
    let x = start.x0 - (d * sign()) / size();
    if (x > 1) x = 1 + rubber(x - 1, 1);
    s.x = x; paint(x);
  });
  const end = e => {
    if (!start) return; const was = start.moved; start = null; if (!was) return;
    const a = hist[0], b = hist[hist.length - 1], dt = Math.max(1, b.t - a.t);
    const vpx = ((b.p - a.p) / dt) * 1000;                // px/s along the axis
    const vProg = -(vpx * sign()) / size();              // progress units per second
    const projected = s.x + project(vProg * 1000) / 1000; // project where the throw lands
    const target = projected < 0.5 ? 0 : 1;
    to(target, { velocity: vProg, damping: Math.abs(vProg) > 1.5 && target === 1 ? 0.8 : 1 });
  };
  panel.addEventListener('pointerup', end); panel.addEventListener('pointercancel', end);
  return { open: () => to(1), close: () => to(0) };
}

let lastY = 0;
function enhance(app){
  // header scroll-edge hairline only when content scrolls under it
  const hdr = app.querySelector('.hdr');
  const heroPh = app.querySelector('main .hero .ph');
  let ticking = false;
  // one rAF-throttled scroll handler: header hairline, spectrum reading progress, gentle hero parallax
  const edge = () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      if (hdr){
        hdr.classList.toggle('edge', scrollY > 8);
        const max = document.documentElement.scrollHeight - innerHeight;
        hdr.style.setProperty('--sp', max > 0 ? Math.min(1, scrollY / max).toFixed(4) : 0);
      }
      if (heroPh && !REDUCED.matches) heroPh.style.translate = `0 ${Math.min(scrollY, 900) * -0.06}px`;
    });
  };
  window.removeEventListener('scroll', window.__edge || (()=>{})); window.__edge = edge;
  window.addEventListener('scroll', edge, { passive: true }); edge();
  // pastel spotlight follows the pointer on hoverable cards
  app.querySelectorAll('.card.hov').forEach(c => c.addEventListener('pointermove', e => {
    const r = c.getBoundingClientRect();
    c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px');
  }, { passive: true }));
  // scroll reveals: blocks rise in once; grids reveal their items one after another
  if (!REDUCED.matches && 'IntersectionObserver' in window){
    const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting){ const t = x.target; t.classList.add('in'); io.unobserve(t); setTimeout(() => { t.classList.remove('rv','in'); t.style.transitionDelay = ''; }, 1200 + (parseInt(t.style.transitionDelay) || 0)); } }), { rootMargin: '0px 0px -8% 0px' });
    const mark = (el, delay) => {
      if (el.getBoundingClientRect().top < innerHeight) return; // never hide what is already on screen
      el.classList.add('rv'); el.style.transitionDelay = delay + 'ms'; io.observe(el);
    };
    app.querySelectorAll('main .sec .wrap > *').forEach(el => {
      if (el.matches('.g2,.g3,.g4,.scroller,.steps,.timeline')) [...el.children].forEach((k, i) => mark(k, Math.min(i, 5) * 70));
      else mark(el, 0);
    });
  }
}

  const big = b.height > 260 && window.__my != null && hoverable.matches;

  if (top < m) top = Math.min(Math.max(m, b.top + 10), vh - ph - m);
  let left = (window.__mx ?? (b.left + b.width / 2)) - pw / 2;

  var mc=$('mc'),panel=$('mcPanel'),body=$('mcBody'),dock=$('mcDock'),fab=$('mcFab'),tip=$('mcTip'),form=$('mcForm'),ta=$('mcText'),sendB=$('mcSend'),status=$('mcStatus'),menu=$('mcMenu'),badge=$('mcBadge'),chips=$('mcChips'),typingEl=$('mcTyping');
  mc.querySelectorAll('[data-i]').forEach(function(e){e.insertAdjacentHTML('afterbegin',PH[e.getAttribute('data-i')]||'')});
  mc.querySelectorAll('img[data-mark]').forEach(function(i){i.src=MARK});
  function L(){return document.documentElement.lang==='en'?'en':'ar'}
  function t(k){return T[L()][k]}

  /* ---------- state ---------- */
  var KEY='mli_chat_v1',S={handle:null,conv:null};
  try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv&&sv.handle&&sv.conv)S=sv}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  var seen={},msgs=[],awaiting=false,typingRemote=false,netDown=false,loaded=!S.conv,unread=0,isOpen=false;

  /* ---------- API ---------- */
  function api(path,bodyObj){
    var h={};if(S.handle)h['X-Widget-Session']=S.handle;if(bodyObj!==undefined)h['Content-Type']='application/json';
    var ac=new AbortController(),to=setTimeout(function(){ac.abort()},15000);
    return fetch(API+path,{method:bodyObj!==undefined?'POST':'GET',headers:h,body:bodyObj!==undefined?JSON.stringify(bodyObj):undefined,signal:ac.signal})
      .then(function(r){clearTimeout(to);if(!r.ok){var e=new Error('HTTP '+r.status);e.status=r.status;throw e}return r.json()})
      .then(function(j){return j&&j.data!==undefined&&j.data!==null?j.data:j});
  }
  function initiate(){return api('/widget-guest/initiate',{widget_id:WIDGET}).then(function(d){S.handle=d.handle;S.conv=d.conversation_id;save();connectRT()})}
  function fetchMsgs(){if(!S.conv)return Promise.resolve();return api('/widget-guest/messages?conversationId='+encodeURIComponent(S.conv)).then(function(d){(d&&d.items||[]).forEach(receive);if(netDown){netDown=false;view()}paintStatus()})}

  /* ---------- realtime (Supabase broadcast, the channel Mojeeb's own client uses) + polling fallback ---------- */
  var sb=null,ch=null,rtUp=false,rtTimer=null,poll=null;
  function loadSupa(){return new Promise(function(res,rej){if(window.supabase)return res();var s=document.createElement('script');s.src=SUPA;s.async=true;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
  function connectRT(){
    if(!S.conv)return;
    loadSupa().then(function(){return api('/widget-guest/realtime-token',{conversation_id:S.conv})}).then(function(tk){
      if(!sb)sb=window.supabase.createClient(tk.supabase_url,tk.supabase_anon_key);
      return sb.realtime.setAuth(tk.token).then(function(){
        if(ch)try{ch.unsubscribe()}catch(e){}
        ch=sb.channel('chat:'+S.conv,{config:{private:true}})
          .on('broadcast',{event:'INSERT'},function(p){receive(p.payload&&p.payload.record)})
          .on('broadcast',{event:'UPDATE'},function(p){receive(p.payload&&p.payload.record)})
          .on('broadcast',{event:'typing'},function(p){typingRemote=!!(p.payload&&p.payload.is_typing);paintTyping()});
        ch.subscribe(function(st){rtUp=st==='SUBSCRIBED'});
        var exp=tk.expires_at?new Date(tk.expires_at).getTime():Date.now()+300000;
        clearTimeout(rtTimer);rtTimer=setTimeout(connectRT,Math.max(15000,exp-Date.now()-30000));
      });
    }).catch(function(){rtUp=false});
  }
  function tick(){
    clearTimeout(poll);if(!S.conv)return;
    if(awaiting||(isOpen&&!rtUp))fetchMsgs().catch(function(){if(!netDown){netDown=true;view()}paintStatus()});
    poll=setTimeout(tick,awaiting?1800:(isOpen?5000:20000));
  }

  /* ---------- markdown (escape first, then a small safe subset) ---------- */
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function inline(s){
    s=esc(s);
    s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    s=s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  }
  function md(src){
    var out='',list=null,para=[];
    function fp(){if(para.length){out+='<p>'+para.map(inline).join('<br>')+'</p>';para=[]}}
    function fl(){if(list){out+='</'+list+'>';list=null}}
    String(src||'').replace(/\r/g,'').split('\n').forEach(function(l){
      var m;
      if(/^\s*$/.test(l)){fp();fl();return}
      if((m=l.match(/^\s*[-*•]\s+(.*)$/))){fp();if(list!=='ul'){fl();out+='<ul>';list='ul'}out+='<li>'+inline(m[1])+'</li>';return}
      if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){fp();if(list!=='ol'){fl();out+='<ol>';list='ol'}out+='<li>'+inline(m[1])+'</li>';return}
      if((m=l.match(/^#{1,4}\s+(.*)$/))){fp();fl();out+='<p><strong>'+inline(m[1])+'</strong></p>';return}
      fl();para.push(l);
    });
    fp();fl();return out;
  }
  function fmtTime(d){try{return new Intl.DateTimeFormat(L()==='ar'?'ar-EG':'en-GB',{hour:'numeric',minute:'2-digit'}).format(d)}catch(e){return ''}}

  /* ---------- view: rows are appended and patched, never redrawn ---------- */
  var extra=null; // welcome, skeleton or notice block
  function setExtra(html){if(extra){extra.remove();extra=null}if(html){var w=document.createElement('div');w.innerHTML=html;extra=w.firstChild;body.insertBefore(extra,msgs.length?typingEl:body.firstChild)}}
  function welcome(){
    return '<div class="mc-hello"><div class="top"><span class="big"><img src="'+MARK+'" alt=""></span><div><h3>'+esc(t('hello'))+'</h3><p>'+esc(t('sub'))+'</p></div></div>'+
      '<div class="mc-list">'+t('q').map(function(x){return '<button type="button" data-q="'+esc(x[0])+'"><span class="ic">'+PH[x[1]]+'</span><span class="tx">'+esc(x[0])+'</span><span class="chev">'+PH[L()==='ar'?'chevL':'chevR']+'</span></button>'}).join('')+'</div></div>';
  }
  function view(){
    if(!msgs.length) setExtra(!loaded?'<div class="mc-sk"><div class="a"></div><div class="b"></div><div class="c"></div></div>':welcome());
    else setExtra(netDown?'<div class="mc-note">'+esc(t('neterr'))+'<button type="button" data-a="reload">'+esc(t('retry'))+'</button></div>':'');
    regroup();paintChips();
  }
  function rowFor(m){
    var r=document.createElement('div');r.className='mc-row '+(m.me?'me':'bot')+' in';r.dataset.k=m.k;
    r.innerHTML=(m.me?'':'<span class="mc-mav"><img src="'+MARK+'" alt=""></span>')+'<div class="mc-col"><div class="mc-b">'+(m.me?'<p>'+inline(m.text).replace(/\n/g,'<br>')+'</p>':md(m.text))+'</div><div class="mc-meta"></div></div>';
    setTimeout(function(){r.classList.remove('in')},600);
    m.el=r;return r;
  }
  function meta(m){
    var el=m.el.querySelector('.mc-meta'),h;
    if(m.me&&m.state==='fail')h='<span>'+esc(t('failed'))+'</span><button type="button" data-retry="'+m.k+'">'+esc(t('retry'))+'</button>';
    else if(m.me&&m.state==='sending')h=PH.clock+'<span>'+esc(t('sending'))+'</span>';
    else h=(m.me?PH.tick:'')+'<span>'+fmtTime(m.at)+'</span>';
    if(el.innerHTML!==h)el.innerHTML=h;
    m.el.classList.toggle('sending',m.state==='sending');m.el.classList.toggle('fail',m.state==='fail');
  }
  function regroup(){
    msgs.forEach(function(m,i){var p=msgs[i-1],n=msgs[i+1];m.el.classList.toggle('first',!p||p.me!==m.me);m.el.classList.toggle('last',!n||n.me!==m.me);meta(m)});
  }
  function add(m){msgs.push(m);if(msgs.length===1&&extra)setExtra('');body.insertBefore(rowFor(m),typingEl);regroup();paintChips();toBottom()}
  function toBottom(){requestAnimationFrame(function(){body.scrollTo({top:body.scrollHeight,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})})}
  function paintTyping(){var on=awaiting||typingRemote;if(typingEl.classList.contains('on')!==on){typingEl.classList.toggle('on',on);if(on)toBottom()}paintStatus();paintChips()}
  function paintStatus(){
    var busy=awaiting||typingRemote;
    status.textContent=netDown?t('offline'):busy?(typingRemote?t('typing'):t('thinking')):t('online');
    status.classList.toggle('busy',busy&&!netDown);
  }
  function paintChips(){
    var last=msgs[msgs.length-1],show=!!(last&&!last.me&&!awaiting&&!typingRemote&&!ta.value.trim());
    if(show&&!chips.childElementCount)chips.innerHTML=t('q').map(function(x){return '<button type="button" data-q="'+esc(x[0])+'">'+esc(x[0])+'</button>'}).join('');
    chips.hidden=!show;
  }

  /* ---------- message flow ---------- */
  function receive(r){
    if(!r||!r.id)return;
    var me=r.sender_role===1;
    if(seen[r.id]){var ex=msgs.find(function(m){return m.sid===r.id});if(ex&&!ex.me&&r.message&&ex.text!==r.message){ex.text=r.message;ex.el.querySelector('.mc-b').innerHTML=md(r.message)}return}
    if(me){ // reconcile with an optimistic bubble
      var pm=msgs.find(function(m){return m.me&&!m.sid&&m.text.trim()===(r.message||'').trim()});
      if(pm){pm.sid=r.id;pm.state='ok';pm.at=new Date(r.created_at);seen[r.id]=1;meta(pm);return}
    }
    seen[r.id]=1;
    add({k:r.id,sid:r.id,me:me,text:r.message||'',at:new Date(r.created_at||Date.now()),state:'ok'});
    if(!me){awaiting=false;typingRemote=false;paintTyping();if(!isOpen){unread++;badge.textContent=unread;badge.classList.add('on')}}
  }
  function send(text){
    text=(text||'').trim();if(!text)return;
    hideTip(true);
    var m={k:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),me:true,text:text,at:new Date(),state:'sending'};
    add(m);
    try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
    deliver(m);
  }
  function deliver(m){
    m.state='sending';meta(m);awaiting=true;paintTyping();
    (S.conv?Promise.resolve():initiate()).then(function(){
      return api('/widget-guest/send',{conversation_id:S.conv,message:m.text,message_type:0});
    }).then(function(d){
      if(d&&d.id){m.sid=d.id;seen[d.id]=1}
      m.state='ok';meta(m);if(netDown){netDown=false;view()}tick();
    }).catch(function(e){
      m.state='fail';meta(m);awaiting=false;paintTyping();
      if(e&&(e.status===401||e.status===403||e.status===404)&&S.conv){S={handle:null,conv:null};save()}
    });
  }

  /* ---------- open / close ---------- */
  function open(prefill){
    if(isOpen){if(prefill)send(prefill);return}
    isOpen=true;mc.classList.add('open');document.body.classList.add('mc-on');fab.setAttribute('aria-expanded','true');hideTip(true);
    unread=0;badge.classList.remove('on');paint();
    if(S.conv&&!loaded){view();fetchMsgs().then(function(){loaded=true;view();toBottom()}).catch(function(){loaded=true;netDown=true;view()});if(!ch)connectRT()}
    else view();
    tick();
    if(prefill)send(prefill);
    else if(matchMedia('(hover:hover)').matches)setTimeout(function(){ta.focus({preventScroll:true})},320);
  }
  function close(){
    if(!isOpen)return;isOpen=false;mc.classList.remove('open');document.body.classList.remove('mc-on');fab.setAttribute('aria-expanded','false');menu.classList.remove('show');panel.style.removeProperty('--drag');paint();
  }
  fab.addEventListener('click',function(){isOpen?close():open()});
  $('mcMin').addEventListener('click',close);
  $('mcScrim').addEventListener('click',close);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&isOpen){menu.classList.contains('show')?menu.classList.remove('show'):close()}});

  /* composer: grows to five lines, the scrollbar only exists past that */
  function fit(){ta.style.height='36px';var h=ta.scrollHeight;ta.style.height=Math.min(118,Math.max(36,h))+'px';ta.classList.toggle('scroll',h>118);sendB.classList.toggle('ready',!!ta.value.trim());if(msgs.length)paintChips()}
  ta.addEventListener('input',fit);
  ta.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit()}});
  function submit(e){if(e)e.preventDefault();var v=ta.value;if(!v.trim())return;ta.value='';fit();send(v)}
  form.addEventListener('submit',submit);

  mc.addEventListener('click',function(e){
    var q=e.target.closest('[data-q]');if(q){isOpen?send(q.getAttribute('data-q')):open(q.getAttribute('data-q'));return}
    var r=e.target.closest('[data-retry]');if(r){var m=msgs.find(function(x){return x.k===r.getAttribute('data-retry')});if(m)deliver(m);return}
    if(e.target.closest('[data-a=reload]')){fetchMsgs().catch(function(){})}
  });

  /* menu */
  $('mcMore').addEventListener('click',function(e){e.stopPropagation();menu.classList.toggle('show')});
  document.addEventListener('click',function(e){if(!e.target.closest('#mcMenu,#mcMore'))menu.classList.remove('show')});
  $('mcNew').addEventListener('click',function(){
    menu.classList.remove('show');
    if(ch)try{ch.unsubscribe()}catch(e){}ch=null;
    msgs.forEach(function(m){m.el.remove()});msgs=[];seen={};awaiting=false;typingRemote=false;loaded=true;paintTyping();
    var h=S.handle;S={handle:h,conv:null};save();view();
    if(h)api('/widget-guest/new-conversation',{}).then(function(d){S.conv=d.conversation_id;save();connectRT()}).catch(function(){});
  });
  $('mcWa').addEventListener('click',function(){menu.classList.remove('show');var s=document.getElementById('washeet');if(s){close();s.classList.add('open')}});

  /* mobile: drag the header down to dismiss; projects the release velocity */
  (function(){
    var hd=$('mcHd'),y0=null,last=0,lt=0,v=0;
    hd.addEventListener('pointerdown',function(e){if(!matchMedia('(max-width:767px)').matches||e.target.closest('button'))return;y0=last=e.clientY;lt=e.timeStamp;v=0;panel.classList.add('dragging');hd.setPointerCapture(e.pointerId)});
    hd.addEventListener('pointermove',function(e){if(y0===null)return;var d=e.clientY-y0;d=d<0?d*0.2:d;panel.style.setProperty('--drag',d+'px');var dt=e.timeStamp-lt;if(dt>0)v=(e.clientY-last)/dt*1000;last=e.clientY;lt=e.timeStamp});
    function end(){if(y0===null)return;var d=last-y0;y0=null;panel.classList.remove('dragging');
      if(d+(v/1000)*0.998/(1-0.998)>panel.offsetHeight*0.35)close();else panel.style.setProperty('--drag','0px')}
    hd.addEventListener('pointerup',end);hd.addEventListener('pointercancel',end);
  })();

  /* greeting tip, held back while the cookie banner is up */
  var tipSeen=false,tipPending=false;try{tipSeen=sessionStorage.getItem('mli-bub')==='1'}catch(e){}
  function hideTip(remember){tip.classList.remove('show');tipPending=false;if(remember)try{sessionStorage.setItem('mli-bub','1')}catch(e){}}
  $('mcTipX').addEventListener('click',function(){hideTip(true)});
  function cbTop(){var c=document.getElementById('cb');if(!c||c.hidden)return 0;var r=c.getBoundingClientRect();return r.height?r.top:0}
  function clear(){
    var top=cbTop(),rz=document.querySelector('.rz');
    if(top){var lift=(innerHeight-top+12)+'px';dock.style.bottom=lift;if(rz)rz.style.setProperty('bottom',lift,'important');if(tip.classList.contains('show')){tip.classList.remove('show');tipPending=true}}
    else{dock.style.bottom='';if(rz)rz.style.removeProperty('bottom');if(tipPending&&!isOpen){tipPending=false;tip.classList.add('show')}}
  }
  setInterval(clear,400);addEventListener('resize',clear);
  if(!tipSeen&&!S.conv)setTimeout(function(){if(isOpen)return;if(cbTop())tipPending=true;else tip.classList.add('show')},2500);

  /* language */
  function paint(){
    var l=L();
    mc.querySelectorAll('[data-t]').forEach(function(e){var k=e.getAttribute('data-t');e.textContent=(k==='cta'&&isOpen)?t('close'):t(k)});
    $('mcTipChips').innerHTML=t('q').slice(0,3).map(function(x){return '<button type="button" data-q="'+esc(x[0])+'">'+esc(x[0])+'</button>'}).join('');
    ta.placeholder=t('ph');sendB.setAttribute('aria-label',t('send'));$('mcMin').setAttribute('aria-label',t('close'));$('mcMore').setAttribute('aria-label',t('more'));$('mcTipX').setAttribute('aria-label',t('close'));
    fab.setAttribute('aria-label',isOpen?t('close'):t('cta'));
    mc.dir=dock.dir=panel.dir=l==='ar'?'rtl':'ltr';
    paintStatus();
  }
  new MutationObserver(function(){paint();chips.innerHTML='';msgs.forEach(meta);if(isOpen)view()}).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
  addEventListener('online',function(){if(S.conv){connectRT();fetchMsgs().catch(function(){})}});
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.conv&&isOpen)fetchMsgs().catch(function(){})});
  paint();fit();
  if(S.conv){connectRT();tick()}
  window.MLIChat={open:open,close:close};
})();
</script>
</body>
</html>
